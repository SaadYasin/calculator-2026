            class="relative flex min-h-11 touch-manipulation items-center justify-center rounded-full border-2 border-[rgba(24,67,93,0.55)] bg-btn-op font-bold shadow-btn transition-[transform,box-shadow,filter,background] duration-[120ms] ease-in [-webkit-tap-highlight-color:transparent] hover:-translate-y-0.5 hover:brightness-[1.06] hover:shadow-btn-hover active:translate-y-[3px] active:brightness-[0.96] active:shadow-btn-active focus-visible:z-[2] focus-visible:outline-none focus-visible:!shadow-btn-focus [&.is-pressed]:translate-y-[3px] [&.is-pressed]:brightness-[0.96] [&.is-pressed]:shadow-btn-active motion-reduce:transition-none aspect-square text-xl sm:text-2xl"
            data-action="operator"
            data-value="+"
            aria-label="Add"
          >+</button>

          <button
            type="button"
            class="relative flex min-h-11 touch-manipulation items-center justify-center rounded-full border-2 border-[rgba(24,67,93,0.55)] bg-btn font-bold shadow-btn transition-[transform,box-shadow,filter,background] duration-[120ms] ease-in [-webkit-tap-highlight-color:transparent] hover:-translate-y-0.5 hover:brightness-[1.06] hover:shadow-btn-hover active:translate-y-[3px] active:brightness-[0.96] active:shadow-btn-active focus-visible:z-[2] focus-visible:outline-none focus-visible:!shadow-btn-focus [&.is-pressed]:translate-y-[3px] [&.is-pressed]:brightness-[0.96] [&.is-pressed]:shadow-btn-active motion-reduce:transition-none aspect-square text-[1.4rem] sm:text-2xl"
            data-action="digit"
            data-value="0"
            aria-label="0"
          >0</button>
          <button
            type="button"
            class="relative flex min-h-11 touch-manipulation items-center justify-center rounded-full border-2 border-[rgba(24,67,93,0.55)] bg-btn font-bold shadow-btn transition-[transform,box-shadow,filter,background] duration-[120ms] ease-in [-webkit-tap-highlight-color:transparent] hover:-translate-y-0.5 hover:brightness-[1.06] hover:shadow-btn-hover active:translate-y-[3px] active:brightness-[0.96] active:shadow-btn-active focus-visible:z-[2] focus-visible:outline-none focus-visible:!shadow-btn-focus [&.is-pressed]:translate-y-[3px] [&.is-pressed]:brightness-[0.96] [&.is-pressed]:shadow-btn-active motion-reduce:transition-none aspect-square text-2xl"
            data-action="decimal"
            aria-label="Decimal point"
          >.</button>
          <button
            type="button"
            class="relative flex min-h-11 touch-manipulation items-center justify-center rounded-full border-2 border-[rgba(24,67,93,0.55)] bg-btn-equals font-bold text-[#05293d] shadow-btn transition-[transform,box-shadow,filter,background] duration-[120ms] ease-in [-webkit-tap-highlight-color:transparent] hover:-translate-y-0.5 hover:brightness-[1.06] hover:shadow-btn-hover active:translate-y-[3px] active:brightness-[0.96] active:shadow-btn-active focus-visible:z-[2] focus-visible:outline-none focus-visible:!shadow-btn-focus [&.is-pressed]:translate-y-[3px] [&.is-pressed]:brightness-[0.96] [&.is-pressed]:shadow-btn-active motion-reduce:transition-none col-span-2 aspect-auto h-full text-2xl sm:text-[1.7rem]"
            data-action="equals"
            aria-label="Equals"
          >=</button>
        </div>
      </section>

      <p class="mt-5 text-center text-[0.7rem] leading-relaxed text-violet-100/45">
        <span class="font-semibold text-violet-100/70">Keyboard ready:</span>
        digits, + − × ÷,
        <kbd class="inline-block rounded-[0.3rem] border border-[rgba(221,214,254,0.24)] bg-white/[0.06] px-[0.3rem] py-[0.05rem] font-sans text-[0.65rem] leading-[1.1] text-[rgba(237,233,254,0.78)]">Enter</kbd>
        equals,
        <kbd class="inline-block rounded-[0.3rem] border border-[rgba(221,214,254,0.24)] bg-white/[0.06] px-[0.3rem] py-[0.05rem] font-sans text-[0.65rem] leading-[1.1] text-[rgba(237,233,254,0.78)]">Esc</kbd>
        clears,
        <kbd class="inline-block rounded-[0.3rem] border border-[rgba(221,214,254,0.24)] bg-white/[0.06] px-[0.3rem] py-[0.05rem] font-sans text-[0.65rem] leading-[1.1] text-[rgba(237,233,254,0.78)]">F9</kbd>
        toggles sign
      </p>
    </div>
  </main>

  <script src="script.js"></script>
